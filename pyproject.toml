[project]
name = "pokerbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alexandre", email = "alexandre.eber07@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pokerkit>=0.7.7",
]

[project.scripts]
pokerbot = "pokerbot.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
